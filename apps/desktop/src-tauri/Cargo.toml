[package]
name = "invoice-analytics-desktop"
version = "0.3.0"
description = "ABM Invoice Analytics"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "invoice_analytics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
