[project]
name = "invoice-analytics-engine"
version = "0.3.0"
description = "ABM Invoice Analytics detection engine (offline)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "sqlcipher3==0.6.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "rapidfuzz>=3.9",
    "jellyfish>=1.1",
    "metaphone>=0.6",
    "openpyxl>=3.1",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "keyring>=25; sys_platform != 'win32'",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "sqlglot>=25",
    "httpx>=0.27",
    "psutil>=6.0",
    "py-cpuinfo>=9.0",
    "numpy>=1.26",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pip-licenses>=5.0",
    "pyinstaller>=6.10",
    "cyclonedx-bom>=5.0",
]

[project.scripts]
invoice-analytics-engine = "invoice_analytics.__main__:main"
synthgen = "synthgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/invoice_analytics", "tools/synthgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "tools"]
addopts = "-q --timeout=300 -m 'not perf and not slow'"
markers = [
    "perf: performance budget tests (make perf)",
    "slow: long-running tests",
    "ai_eval: model bake-off (needs a GGUF model)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["engine", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "S311", "B008", "E501"]  # E501: black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017", "E741", "E743", "SIM105"]
"tools/**" = ["S"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["engine", "tools"]
ignore_missing_imports = true
exclude = ["tests/"]
